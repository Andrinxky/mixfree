
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixLibre — Música a tu manera</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#11121a;color:#f4f4f7;font:16px system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:28px 18px}
h1{font-size:38px;margin:0}
h1 span{color:#b8a0ff}
.sub{color:#aaaaba;margin-top:6px}
.panel{background:#1d1e2a;border:1px solid #343546;border-radius:18px;padding:20px;margin-top:22px}
label{display:block;font-weight:600;margin:15px 0 8px}
input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #46475b;background:#12131c;color:white;font:inherit}
textarea{min-height:90px;resize:vertical}
button{background:#b8a0ff;color:#171322;border:0;border-radius:10px;padding:12px 17px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.45;cursor:wait}
.secondary{background:#303143;color:white}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
#status{color:#c6b8ff;min-height:24px;margin-top:14px}
#player{width:100%;aspect-ratio:16/9;background:#08080c;border-radius:12px;overflow:hidden;margin-top:16px}
#player iframe{width:100%;height:100%}
.song{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #343546}
.song:last-child{border:0}
.song button{padding:9px 12px;flex-shrink:0}
.songname{flex:1;min-width:0}
.songname strong{display:block;overflow-wrap:anywhere}
.songname small{color:#aaaaba}
.note{color:#aaaaba;font-size:13px;line-height:1.5}
a{color:#c6b8ff}
</style>
</head>
<body>
<main>
  <h1>Mix<span>Libre</span> 🎧</h1>
  <div class="sub">Tú eliges los artistas. La música hace el resto.</div>

  <section class="panel">
    <label for="artists">¿Qué artistas quieres mezclar?</label>
    <textarea id="artists">Charly García, The Beatles</textarea>

    <label for="count">Canciones por artista</label>
    <input id="count" type="number" min="1" max="10" value="5">

    <label for="key">Clave de YouTube (la configuraremos después)</label>
    <input id="key" type="password" placeholder="Pega aquí tu clave de API">

    <div class="actions">
      <button id="make">Crear mi mezcla aleatoria</button>
    </div>
    <div id="status">Añade tus artistas y prepara tu primera mezcla.</div>
    <p class="note">La búsqueda usa YouTube. La reproducción se realiza en su reproductor oficial y puede incluir anuncios.</p>
  </section>

  <section class="panel">
    <strong>▶ Reproductor</strong>
    <div id="player"></div>
    <div class="actions">
      <button class="secondary" id="prev">⏮ Anterior</button>
      <button id="play">▶ Reproducir</button>
      <button class="secondary" id="next">Siguiente ⏭</button>
      <button class="secondary" id="shuffle">🔀 Mezclar</button>
    </div>
  </section>

  <section class="panel">
    <strong>Tu lista</strong>
    <div id="list" class="sub" style="margin-top:14px">Tu lista aparecerá aquí.</div>
  </section>
</main>

<script>
let songs = [];
let current = 0;
let player = null;
let playerReady = false;

const $ = id => document.getElementById(id);
function status(message){ $("status").textContent = message; }

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function showList(){
  const list=$("list");
  list.replaceChildren();
  if(!songs.length){list.textContent="Tu lista aparecerá aquí.";return;}
  songs.forEach((song,index)=>{
    const row=document.createElement("div");
    row.className="song";
    const info=document.createElement("div");
    info.className="songname";
    const title=document.createElement("strong");
    title.textContent=(index+1)+". "+song.title;
    const artist=document.createElement("small");
    artist.textContent=song.artist;
    info.append(title,artist);
    const button=document.createElement("button");
    button.textContent="▶";
    button.setAttribute("aria-label","Reproducir "+song.title);
    button.onclick=()=>playAt(index);
    row.append(info,button);
    list.append(row);
  });
}

async function createMix(){
  const apiKey=$("key").value.trim();
  const artists=$("artists").value.split(/,|\n/).map(x=>x.trim()).filter(Boolean);
  const count=Math.max(1,Math.min(10,Number($("count").value)||5));

  if(!apiKey){status("Primero necesitamos configurar la clave gratuita de YouTube. Te guiaré para conseguirla.");return;}
  if(!artists.length){status("Escribe al menos un artista.");return;}

  $("make").disabled=true;
  songs=[];
  showList();
  try{
    for(const artist of artists){
      status("Buscando canciones de "+artist+"…");
      const query=encodeURIComponent(artist+" official music");
      const url="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults="+count+"&q="+query+"&key="+encodeURIComponent(apiKey);
      const response=await fetch(url);
      const data=await response.json();
      if(!response.ok) throw new Error(data.error?.message||"No se pudo buscar en YouTube.");
      for(const item of (data.items||[])){
        if(item.id?.videoId){
          songs.push({
            id:item.id.videoId,
            title:item.snippet.title,
            artist:artist
          });
        }
      }
    }
    songs=shuffleArray(songs);
    current=0;
    showList();
    if(songs.length){
      status("¡Mezcla lista! Pulsa Reproducir para empezar.");
      if(playerReady) player.cueVideoById(songs[0].id);
    }else{
      status("No encontramos canciones. Prueba con otros nombres.");
    }
  }catch(error){
    status("No se pudo completar la búsqueda: "+error.message+". Comprueba la clave de API.");
  }finally{
    $("make").disabled=false;
  }
}

function playAt(index){
  if(!songs.length){status("Primero crea una mezcla.");return;}
  current=(index+songs.length)%songs.length;
  showList();
  if(!playerReady){
    status("El reproductor todavía está cargando. Inténtalo de nuevo en unos segundos.");
    return;
  }
  player.loadVideoById(songs[current].id);
  status("Reproduciendo: "+songs[current].title);
}

function next(){if(songs.length)playAt(current+1);}
function prev(){if(songs.length)playAt(current-1);}

$("make").addEventListener("click",createMix);
$("next").addEventListener("click",next);
$("prev").addEventListener("click",prev);
$("play").addEventListener("click",()=>{
  if(!songs.length){status("Primero crea una mezcla.");return;}
  if(!playerReady){status("El reproductor está cargando. Inténtalo de nuevo.");return;}
  if(player.getPlayerState()===1) player.pauseVideo();
  else if(player.getPlayerState()===5||player.getPlayerState()===-1) playAt(current);
  else player.playVideo();
});
$("shuffle").addEventListener("click",()=>{
  if(!songs.length)return;
  const playing=songs[current];
  songs=shuffleArray(songs);
  current=songs.indexOf(playing);
  showList();
  status("Lista mezclada de nuevo.");
});

window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player("player",{
    videoId:"",
    playerVars:{playsinline:1,rel:0},
    events:{
      onReady:()=>{playerReady=true;},
      onStateChange:event=>{
        if(event.data===YT.PlayerState.ENDED)next();
      }
    }
  });
};

const script=document.createElement("script");
script.src="https://www.youtube.com/iframe_api";
document.head.appendChild(script);
</script>
</body>
</html>
